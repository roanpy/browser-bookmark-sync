name: Feature request
description: Propose a focused improvement to bookmark mirroring or recovery.
title: "feature: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Keep requests focused on local bookmark mirroring, recovery, safety, or supported browser formats.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve? Do not include private bookmark data.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful behavior or interface change.
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser scope
      options:
        - Chrome
        - Edge
        - Safari
        - Brave
        - Vivaldi
        - Opera
        - Cross-browser
        - Tooling or documentation
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed real bookmark data, backups, private URLs, account names, and local paths.
          required: true
