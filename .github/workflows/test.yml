name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python3 -m pip install --disable-pip-version-check "ruff==0.15.8"
      - run: python3 -m unittest discover -s tests
      - run: python3 -m py_compile bookmark_sync.py bookmark_sync_version.py sync_bookmarks.py sync-bookmarks
      - run: python3 -m pip wheel --disable-pip-version-check --no-deps . --wheel-dir /tmp/bookmark-sync-wheel
      - run: python3 -m pip install --disable-pip-version-check --no-deps /tmp/bookmark-sync-wheel/*.whl && bookmark-sync --version
      - run: ruff check .
      - run: ruby -e 'require "yaml"; YAML.load_file(".github/workflows/release.yml"); puts "release.yml YAML parsed"'
      - name: Verify app stays sealed after running the bundled CLI
        run: |
          app="$RUNNER_TEMP/Bookmark Sync.app"
          ./build-macos-app "$app"
          BOOKMARK_SYNC_HOME="$RUNNER_TEMP/bookmark-sync-home" "$app/Contents/Resources/bin/sync-bookmarks" --list-backups --json
          test ! -d "$app/Contents/Resources/bin/__pycache__"
          codesign --verify --deep --strict "$app"
