name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: python3 -m pip install --disable-pip-version-check "ruff==0.15.8"
      - run: python3 -m unittest discover -s tests
      - run: python3 -m py_compile bookmark_sync.py sync_bookmarks.py sync-bookmarks
      - run: python3 -m pip wheel --disable-pip-version-check --no-deps . --wheel-dir /tmp/bookmark-sync-wheel
      - run: ruff check .
      - run: ruby -e 'require "yaml"; YAML.load_file(".github/workflows/release.yml"); puts "release.yml YAML parsed"'
      - run: ./build-macos-app "$RUNNER_TEMP/Bookmark Sync.app"
