name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    environment:
      name: release
    env:
      APP_PATH: "$RUNNER_TEMP/Bookmark Sync.app"
      KEYCHAIN_PATH: "$RUNNER_TEMP/bookmark-sync-release.keychain-db"
      NOTARY_ZIP: "$RUNNER_TEMP/Bookmark-Sync-notary.zip"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Validate tagged version and tests
        run: |
          set -eu
          expected_tag="v$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "$expected_tag" || {
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $expected_tag"
            exit 1
          }
          python3 -m unittest discover -s tests

      - name: Require Apple release credentials
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -eu
          test -n "$MACOS_CERTIFICATE_BASE64" || { echo "::error::Missing MACOS_CERTIFICATE_BASE64"; exit 1; }
          test -n "$MACOS_CERTIFICATE_PASSWORD" || { echo "::error::Missing MACOS_CERTIFICATE_PASSWORD"; exit 1; }
          test -n "$APPLE_DEVELOPER_ID" || { echo "::error::Missing APPLE_DEVELOPER_ID"; exit 1; }
          test -n "$APPLE_ID" || { echo "::error::Missing APPLE_ID"; exit 1; }
          test -n "$APPLE_TEAM_ID" || { echo "::error::Missing APPLE_TEAM_ID"; exit 1; }
          test -n "$APPLE_APP_PASSWORD" || { echo "::error::Missing APPLE_APP_PASSWORD"; exit 1; }

      - name: Install Developer ID certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -eu
          keychain_password="$(openssl rand -hex 16)"
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$KEYCHAIN_PATH"

      - name: Build wheel and signed app
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
        run: |
          set -eu
          python3 -m pip wheel --disable-pip-version-check --no-deps . --wheel-dir dist
          ./build-macos-app "$APP_PATH"
          codesign --force --deep --options runtime --timestamp --sign "$APPLE_DEVELOPER_ID" "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$NOTARY_ZIP"

      - name: Notarize and staple app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -eu
          xcrun notarytool submit "$NOTARY_ZIP" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "dist/Bookmark-Sync-macos.zip"

      - name: Create checksums
        run: |
          set -eu
          shasum -a 256 dist/* > dist/SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Bookmark Sync $GITHUB_REF_NAME" --generate-notes

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$RUNNER_TEMP/developer-id.p12"
