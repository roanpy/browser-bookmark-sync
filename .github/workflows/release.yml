name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    environment:
      name: release
    env:
      APP_PATH: "$RUNNER_TEMP/Bookmark Sync.app"
      KEYCHAIN_PATH: "$RUNNER_TEMP/bookmark-sync-release.keychain-db"
      NOTARY_ZIP: "$RUNNER_TEMP/Bookmark-Sync-notary.zip"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Validate tagged version and tests
        run: |
          set -eu
          expected_tag="v$(python3 -c 'from bookmark_sync_version import __version__; print(__version__)')"
          test "$GITHUB_REF_NAME" = "$expected_tag" || {
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $expected_tag"
            exit 1
          }
          python3 -m unittest discover -s tests

      - name: Determine release mode
        id: release_mode
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -eu
          provided=0
          missing=0
          for value in \
            "$MACOS_CERTIFICATE_BASE64" \
            "$MACOS_CERTIFICATE_PASSWORD" \
            "$APPLE_DEVELOPER_ID" \
            "$APPLE_ID" \
            "$APPLE_TEAM_ID" \
            "$APPLE_APP_PASSWORD"
          do
            if [ -n "$value" ]; then
              provided=$((provided + 1))
            else
              missing=$((missing + 1))
            fi
          done
          if [ "$provided" -gt 0 ] && [ "$missing" -gt 0 ]; then
            echo "::error::Apple release credentials must be configured as a complete set"
            exit 1
          fi
          if [ "$provided" -eq 6 ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No Apple credentials configured; publishing source and wheel only."
          fi

      - name: Install Developer ID certificate
        if: steps.release_mode.outputs.signed == 'true'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -eu
          keychain_password="$(openssl rand -hex 16)"
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$KEYCHAIN_PATH"

      - name: Build source and wheel
        run: |
          set -eu
          python3 -m pip wheel --disable-pip-version-check --no-deps . --wheel-dir dist
          version="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="bookmark-sync-${version}/" -o "dist/bookmark-sync-${version}.tar.gz" "$GITHUB_SHA"

      - name: Build signed app
        if: steps.release_mode.outputs.signed == 'true'
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
        run: |
          set -eu
          ./build-macos-app "$APP_PATH"
          codesign --force --deep --options runtime --timestamp --sign "$APPLE_DEVELOPER_ID" "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$NOTARY_ZIP"

      - name: Notarize and staple app
        if: steps.release_mode.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -eu
          xcrun notarytool submit "$NOTARY_ZIP" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "dist/Bookmark-Sync-macos.zip"

      - name: Create checksums
        run: |
          set -eu
          (cd dist && shasum -a 256 *) > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" dist/SHA256SUMS
          (cd dist && shasum -a 256 -c SHA256SUMS)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Bookmark Sync $GITHUB_REF_NAME" --generate-notes

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$RUNNER_TEMP/developer-id.p12"
