[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "bookmark-sync"
dynamic = ["version"]
description = "Safe, local-first bookmark mirroring and repair across macOS browsers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["bookmarks", "browser", "chrome", "edge", "safari", "sync"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = []

[project.scripts]
bookmark-sync = "sync_bookmarks:main"

[project.urls]
Homepage = "https://github.com/roanpy/browser-bookmark-sync"
Repository = "https://github.com/roanpy/browser-bookmark-sync"
Issues = "https://github.com/roanpy/browser-bookmark-sync/issues"

[tool.setuptools]
py-modules = ["bookmark_sync", "bookmark_sync_version", "sync_bookmarks"]

[tool.setuptools.dynamic]
version = {attr = "bookmark_sync_version.__version__"}
