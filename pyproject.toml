[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookmark-sync"
version = "0.1.1"
description = "Safe, local-first bookmark mirroring and repair across macOS browsers"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
keywords = ["bookmarks", "browser", "chrome", "edge", "safari", "sync"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = []

[project.scripts]
bookmark-sync = "sync_bookmarks:main"

[project.urls]
Homepage = "https://github.com/roanpy/browser-bookmark-sync"
Repository = "https://github.com/roanpy/browser-bookmark-sync"
Issues = "https://github.com/roanpy/browser-bookmark-sync/issues"

[tool.setuptools]
py-modules = ["bookmark_sync", "sync_bookmarks"]
